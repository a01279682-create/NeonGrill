<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#ff3cac"/>
      <stop offset="1" stop-color="#2ee6ff"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="20" fill="#08090d"/>
  <g transform="translate(100,100) scale(0.9)">
    <g transform="translate(-40,-10)">
      <!-- bun top -->
      <ellipse cx="60" cy="20" rx="62" ry="28" fill="url(#g)" opacity="0.18"/>
      <ellipse cx="60" cy="18" rx="62" ry="28" fill="#ff3cac" opacity="0.06"/>
      <ellipse cx="60" cy="20" rx="62" ry="28" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </g>
    <g transform="translate(-10,10)">
      <!-- burger -->
      <rect x="-70" y="20" width="140" height="36" rx="10" fill="#c47c2a"/>
      <rect x="-66" y="28" width="132" height="20" rx="6" fill="#8b3b27"/>
      <rect x="-66" y="16" width="132" height="12" rx="6" fill="url(#g)" opacity="0.12"/>
    </g>
    <!-- neon ring -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="rgba(46,230,255,0.08)" stroke-width="6"/>
    <circle cx="0" cy="0" r="86" fill="none" stroke="rgba(255,60,172,0.06)" stroke-width="12"/>
    <!-- text -->
    <text x="0" y="80" text-anchor="middle" fill="url(#g)" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="20">NEON</text>
    <text x="0" y="100" text-anchor="middle" fill="#f8f5ee" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16">GRILL</text>
  </g>
</svg>
